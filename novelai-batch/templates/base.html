<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NovelAI 画像生成{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <nav>
      <a href="/" class="{{ 'active' if request.path == '/' else '' }}">1枚だけ生成</a>
      <a href="/batch" class="{{ 'active' if request.path == '/batch' else '' }}">まとめて生成</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
