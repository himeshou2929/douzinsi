<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>NovelAI 画像生成</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; }
    label { font-weight: bold; display: block; margin-top: 16px; }
    button { margin-top: 16px; padding: 10px 24px; font-size: 16px; cursor: pointer; }
    .error { color: #c0392b; margin-top: 16px; white-space: pre-wrap; }
    img { max-width: 100%; margin-top: 24px; border: 1px solid #ddd; }
    nav a { margin-right: 16px; }
  </style>
</head>
<body>
  <nav>
    <a href="/"><b>1枚だけ生成</b></a>
    <a href="/batch">まとめて生成</a>
  </nav>

  <h1>NovelAI 画像生成</h1>

  <form method="post">
    <label for="prompt">プロンプト</label>
    <textarea name="prompt" id="prompt" rows="4">{{ request.form.get('prompt', '') }}</textarea>

    <label for="negative_prompt">ネガティブプロンプト</label>
    <textarea name="negative_prompt" id="negative_prompt" rows="2">{{ request.form.get('negative_prompt', '') }}</textarea>

    <button type="submit">生成する</button>
  </form>

  {% if error %}
    <div class="error">エラー: {{ error }}</div>
  {% endif %}

  {% if image_url %}
    <img src="{{ image_url }}" alt="生成結果">
  {% endif %}
</body>
</html>
