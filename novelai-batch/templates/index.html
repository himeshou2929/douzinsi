{% extends "base.html" %}
{% block title %}NovelAI 画像生成{% endblock %}
{% block content %}
  <h1>NovelAI 画像生成</h1>

  <form method="post" class="form">
    <label for="prompt">プロンプト</label>
    <textarea name="prompt" id="prompt" rows="4">{{ prompt }}</textarea>

    <label for="negative_prompt">ネガティブプロンプト</label>
    <textarea name="negative_prompt" id="negative_prompt" rows="2">{{ negative_prompt }}</textarea>

    <button type="submit">生成する</button>
  </form>

  {% if error %}
    <div class="error">エラー: {{ error }}</div>
  {% endif %}

  {% if image_url %}
    <img class="result" src="{{ image_url }}" alt="生成結果">
  {% endif %}
{% endblock %}
